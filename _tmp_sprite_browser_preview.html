<!doctype html><html lang="ja"><meta charset="utf-8"><link rel="stylesheet" href="css/style.css"><style>
* { box-sizing: border-box; }
body,html { margin:0!important;padding:0!important;background:#29573d!important;color:white!important;font:14px Arial,sans-serif!important;width:100%!important;height:100%!important;overflow:hidden!important; }
#page{position:relative;width:1100px;height:450px;background:linear-gradient(110deg,#245239,#5b6f4a,#2e6046);}
.legend{position:absolute;top:8px;font-size:14px;color:white}
.fw-unit{width:34px!important;height:34px!important;position:absolute!important;display:block!important;}
.fw-unit-shadow,.fw-unit-icon{display:block!important;}
</style><div id="page"></div><script>
const names=['attacker','defender','attacker ally','defender ally','attacker self-ally','defender self-ally'];
const map=document.querySelector('#page');
for(let i=0;i<6;i++){
 const txt=document.createElement('div');txt.className='legend';txt.style.left=(35+175*i)+'px';txt.textContent=names[i];map.append(txt);
 for(let j=0;j<4;j++){
  const div=document.createElement('div'); div.className='fw-unit '+names[i]+(j%2===1?' general':'')+(j>=2?' is-sea-unit':'');
  div.style.left=(70+175*i)+'px';div.style.top=(65+j*94)+'px'; div.style.setProperty('--fw-dir',`${i*60}deg`);
  div.innerHTML='<div class="fw-unit-shadow"></div><div class="fw-unit-icon"></div>';
  map.append(div);
 }
}
</script></html>
