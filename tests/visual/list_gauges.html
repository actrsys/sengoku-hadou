<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><!-- APP_CSS --></head>
<body class="is-pc" style="background:#121519;color:#ddd;">
<main style="width:260px;margin:30px;padding:16px;">
  <div data-gauge="power" data-percent="65" style="height:32px;">
    <div class="list-bar-cell"><div class="bar-bg bar-bg-power"><div class="bar-fill bar-fill-power" style="--bar-value:65%;"></div></div></div>
  </div>
  <div data-gauge="power" data-percent="100" style="height:32px;">
    <div class="list-bar-cell"><div class="bar-bg bar-bg-power"><div class="bar-fill bar-fill-power" style="--bar-value:100%;"></div></div></div>
  </div>
  <div data-gauge="friend" data-percent="40" style="height:32px;">
    <div class="list-bar-cell"><div class="bar-bg bar-bg-friend"><div class="bar-fill bar-fill-friend" style="--bar-value:40%;"></div></div></div>
  </div>
  <div data-gauge="friend" data-percent="85" style="height:32px;">
    <div class="list-bar-cell"><div class="bar-bg bar-bg-friend"><div class="bar-fill bar-fill-friend" style="--bar-value:85%;"></div></div></div>
  </div>
</main>
</body>
</html>
