<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><!-- APP_CSS --></head>
<body class="is-pc">
  <div id="game-screen" style="width:1280px;height:720px;background:#1b3822;box-sizing:border-box;position:relative;overflow:hidden;">
    <div id="pc-new-command-area" style="display:flex;gap:5px;padding:24px;">
      <div class="pc-cmd-col">
        <button id="cmd-normal" class="cmd-btn category">内政</button>
        <button id="cmd-active" class="cmd-btn category active">軍事</button>
      </div>
    </div>

    <div id="interview-modal" class="modal">
      <div id="interview-session-content" class="modal-content interview-session-content">
        <div class="interview-session-header">
          <div class="interview-session-kicker">家臣面談</div>
          <h3 id="interview-session-title">面談</h3>
          <div id="interview-session-hint" class="interview-session-hint">話したい内容を選んでください。</div>
        </div>
        <div class="interview-session-main">
          <div id="interview-session-summary-panel" class="interview-session-summary-panel">
            <div class="interview-session-summary-head">
              <div class="interview-session-summary-caption">面談相手</div>
              <div id="interview-session-name" class="interview-session-name">武将名</div>
            </div>
            <div id="interview-session-meta" class="interview-session-meta">
              <div class="interview-session-meta-row">所在：清洲城</div>
              <div class="interview-session-meta-row">身分：城主</div>
              <div class="interview-session-meta-row">年齢：35歳</div>
            </div>
            <div id="interview-session-stats" class="interview-session-stats">
              <div class="interview-session-stat"><span class="interview-session-stat-label">統率</span><span class="interview-session-stat-value"><span class="grade-container rank-a"><span class="grade-main">A</span></span></span></div>
              <div class="interview-session-stat"><span class="interview-session-stat-label">武勇</span><span class="interview-session-stat-value"><span class="grade-container rank-b"><span class="grade-main">B</span><span class="grade-sub">+</span></span></span></div>
              <div class="interview-session-stat"><span class="interview-session-stat-label">内政</span><span class="interview-session-stat-value"><span class="grade-container rank-b"><span class="grade-main">B</span><span class="grade-sub">+</span></span></span></div>
              <div class="interview-session-stat"><span class="interview-session-stat-label">外交</span><span class="interview-session-stat-value"><span class="grade-container rank-b"><span class="grade-main">B</span></span></span></div>
              <div class="interview-session-stat"><span class="interview-session-stat-label">智謀</span><span class="interview-session-stat-value"><span class="grade-container rank-b"><span class="grade-main">B</span><span class="grade-sub">+</span></span></span></div>
              <div class="interview-session-stat"><span class="interview-session-stat-label">魅力</span><span class="interview-session-stat-value"><span class="grade-container rank-b"><span class="grade-main">B</span><span class="grade-sub">+</span></span></span></div>
            </div>
          </div>
          <div id="interview-session-body" class="interview-session-body interview-session-conversation-view">
            <div class="dialog-body-container interview-session-dialog-body">
              <div class="dialog-face-column interview-session-dialog-face-column">
                <div class="dialog-name-label interview-session-dialog-name-label">武将名</div>
                <div class="interview-session-dialog-face-space"><div class="sp-face-wrapper dialog-face-wrapper"></div></div>
              </div>
              <div class="message-area interview-session-message-area">「殿、どのようなご用件でしょうか？」</div>
            </div>
          </div>
        </div>
        <div id="interview-session-pager" class="interview-session-pager hidden"></div>
        <div id="interview-session-inline-actions" class="interview-session-inline-actions">
          <button class="daimyo-detail-action-btn interview-session-inline-btn">調子はどうだ</button>
          <button class="daimyo-detail-action-btn interview-session-inline-btn">他者について聞く</button>
        </div>
      </div>
      <div id="interview-session-footer" class="modal-footer interview-session-footer">
        <button class="btn-secondary">戻る</button>
      </div>
    </div>
  </div>
</body>
</html>
