<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><!-- APP_CSS --></head>
<body class="is-pc">
<div id="title-screen">
  <div class="title-content">
    <div class="title-brand">
      <div class="title-kicker">SENGOKU STRATEGY</div>
      <h1 class="game-title">戦国覇道</h1>
      <div class="title-rule" aria-hidden="true"><span></span></div>
      <div class="title-subtitle">乱世を駆け、天下への道を拓く</div>
    </div>
    <div class="title-menu">
      <div id="menu-buttons" class="title-menu-buttons">
        <button id="start-btn" class="title-btn">はじめから</button>
        <button class="title-btn">続きから</button>
        <button class="title-btn">ロード</button>
        <button class="title-btn">観戦する</button>
        <button class="title-btn">指南書</button>
        <button class="title-btn">設定</button>
        <button class="title-btn">情報</button>
      </div>
      <div id="title-info-menu" class="title-menu-buttons hidden">
        <button id="title-credit-btn" class="title-btn">クレジット</button>
        <button class="title-btn">ライセンス</button>
        <button class="title-btn title-btn-disabled" disabled>問い合わせ<span class="title-btn-note">準備中</span></button>
        <button class="title-btn title-back-btn">戻る</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
