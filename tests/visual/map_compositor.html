<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../css/style.css">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
#map-wrapper{width:100%;height:100%;display:flex;position:relative}
#map-scroll-container{position:relative}
#map-container{width:3140px;height:2440px;left:0;top:0;position:absolute;transform:scale(.5);transform-origin:0 0}
#sample-cover{position:fixed;inset:0;background:#252b27;z-index:99999}
#sample-cover.hidden{display:none}
#test-castle{left:450px;top:400px;position:absolute;z-index:10;width:50px;height:50px;background:#842c2c;border:3px solid #f0d68d}
</style></head>
<body class="is-pc">
<div id="map-wrapper"><div id="map-scroll-container"><div id="map-spacer" style="position:absolute;left:0;top:0;width:1570px;height:1220px;pointer-events:none"></div><div id="map-container" class="base-map-image-ready">
<img id="map-base-image" src="../../data/images/map/japan_map.png" alt="" width="3140" height="2440">
<canvas id="clan-color-overlay" width="3140" height="2440" style="position:absolute;left:0;top:0;width:3140px;height:2440px;z-index:2;pointer-events:none"></canvas>
<div id="test-castle"></div>
</div></div></div><div id="sample-cover" class="hidden"></div>
<script>
window.verifyMapLayers = async function (pc, lowMemory) {
    document.body.classList.toggle('is-pc',pc);
    document.documentElement.classList.toggle('mobile-low-memory',!!lowMemory);
    window.__mobileLowMemoryMode=!!lowMemory;
    const img=document.getElementById('map-base-image');
    if(!img.complete) await new Promise((r,j)=>{img.addEventListener('load',r,{once:true});img.addEventListener('error',j,{once:true});});
    await img.decode();
    const scroll=document.getElementById('map-scroll-container');
    const cover=document.getElementById('sample-cover');
    scroll.scrollTop=100;scroll.scrollLeft=100;
    for(let i=0;i<20;i++) {
        cover.classList.remove('hidden');
        document.body.classList.add('background-paused');
        await new Promise(resolve=>requestAnimationFrame(resolve));
        document.body.classList.remove('background-paused');
        await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
        cover.classList.add('hidden');
    }
    return {pc,lowMemory,imgDisplay:getComputedStyle(img).display,background:getComputedStyle(document.getElementById('map-container')).backgroundImage,scrollDisplay:getComputedStyle(scroll).display,scrollLeft:scroll.scrollLeft,scrollTop:scroll.scrollTop,imgNaturalWidth:img.naturalWidth,castlePresent:document.getElementById('test-castle').parentNode===document.getElementById('map-container')};
};
</script>
</body></html>
