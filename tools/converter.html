<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>戦国覇道 データ圧縮ツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            color: #333;
        }
        
        /* 破線の枠が付いたドロップ専用エリアのデザイン */
        #drop-zone {
            width: 100%;
            max-width: 500px;
            height: 200px;
            border: 3px dashed #999;
            border-radius: 10px;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 20px 0;
            transition: all 0.2s ease; /* 色が変わる時のアニメーション */
            cursor: pointer; /* マウスを乗せると指のマークになります */
        }

        /* ファイルを上に乗せた時のドロップエリアの色 */
        #drop-zone.dragover {
            background-color: #e3f2fd;
            border-color: #2196f3;
            color: #1565c0;
        }

        /* 箱の中の文字のデザイン */
        #drop-zone p {
            margin: 10px 0;
            font-size: 1.1em;
            pointer-events: none; /* 文字がドラッグの邪魔をしないようにします */
        }
        
        /* 本当のファイル選択ボタンは見えなくしておきます */
        #fileInput {
            display: none;
        }
        
        /* 代わりのボタンのデザイン */
        .btn {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            pointer-events: none; /* ボタンもドラッグの邪魔をしないようにします */
        }
    </style>
</head>
<body>
    <h2>CSVをバイナリ（.bin）に圧縮するツール</h2>
    <p>邪魔な改行を取り除いてから圧縮します。</p>

    <!-- ここが新しく作ったドロップ専用の箱です -->
    <div id="drop-zone">
        <p>ここに「warriors.csv」をドロップしてください</p>
        <p>または</p>
        <button class="btn">ファイルを選択</button>
    </div>

    <!-- 本当のボタンは隠しておきます -->
    <input type="file" id="fileInput" accept=".csv">

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');

        // ファイルを読み込んで圧縮するお仕事のまとまり
        function processFile(file) {
            if (!file) return;
            
            // CSVファイル以外が選ばれたら注意します
            if (!file.name.endsWith('.csv')) {
                alert("CSVファイルを選んでください。");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;

                let cleanedText = "";
                let insideQuotes = false;

                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    
                    if (char === '"') {
                        insideQuotes = !insideQuotes;
                        cleanedText += char;
                    } else if ((char === '\n' || char === '\r') && insideQuotes) {
                        // 文章の中の改行は無視
                    } else {
                        cleanedText += char;
                    }
                }

                const textEncoder = new TextEncoder();
                const uint8array = textEncoder.encode(cleanedText);
                const compressed = pako.deflate(uint8array);

                const blob = new Blob([compressed], { type: "application/octet-stream" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                
                a.download = file.name.replace(".csv", ".bin"); 
                a.click();
                
                URL.revokeObjectURL(url);
            };
            reader.readAsText(file);
        }

        // 箱をクリックした時は、隠してある本当のボタン（fileInput）を代わりに押します
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // ボタンからファイルが選ばれた時
        fileInput.addEventListener('change', function(e) {
            processFile(e.target.files[0]);
            e.target.value = '';
        });

        // 箱の上にファイルが来た時（色を変える）
        dropZone.addEventListener('dragover', function(e) {
            e.preventDefault(); 
            dropZone.classList.add('dragover');
        });

        // 箱の上からファイルが離れた時（色を戻す）
        dropZone.addEventListener('dragleave', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        // 箱の中にファイルが落とされた時
        dropZone.addEventListener('drop', function(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });
    </script>
</body>
</html>
